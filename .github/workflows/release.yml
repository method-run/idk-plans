name: Release

# Publish to npm and make a GitHub release when a version tag is pushed.
# npm trusts this workflow (trusted publishing), so it needs no token.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, such as v0.2.0
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run docs:check

      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@${TAG#v}" version >/dev/null 2>&1; then
            echo "$name@${TAG#v} is already on npm"
          else
            npm publish
          fi

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
